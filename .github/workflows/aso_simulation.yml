name: "Connect ASO & Store Assortment E2E Simulation Engine"
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      simulation_mode:
        description: "Run in pure simulation mode? (Y/N)"
        required: true
        default: "N"
      study_stage:
        description: "Initial Study Stage to execute (segmentation / model)"
        required: true
        default: "segmentation"
permissions:
  contents: read
  actions: write
env:
  EXECUTION_ID: "7001662"
  ANALYSIS_ID: "11003982"
  VERSION_ID: "7000988"
  GEN2REGION: "US"
  GEN2ENVIRONMENT: "UAT"
jobs:
  run-e2e-assortment-pipeline:
    name: "Execute E2E Shelf & Store Assortment Simulation"
    runs-on: ubuntu-latest

    steps:
      - name: "Step 1: Checkout Simulation Workspace"
        uses: actions/checkout@v4

      - name: "Step 2: Initialize Runtime Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: "Step 3: Hydrate Computational Mock Libraries"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Step 4: Initialize Ephemeral Workspace Artifact Layouts"
        run: |
          mkdir -p /tmp/databricks/jars/
          mkdir -p /tmp/databricks/pythonfiles/
          mkdir -p /tmp/adls/mcc/segmentation/${{ env.ANALYSIS_ID }}/output/
          mkdir -p scripts/
          
          echo "Simulated Shaded Class Registry" > /tmp/databricks/jars/seff-aso-common.jar
          echo "Simulated Wheel Functions Manifest" > /tmp/databricks/pythonfiles/aso_task_main_aes.py
      - name: "Step 5: Execute Task-by-Task Assortment Pipeline Pipeline"
        env:
          SIMULATION_MODE: ${{ github.event.inputs.simulation_mode || 'N' }}
          STUDY_STAGE: ${{ github.event.inputs.study_stage || 'segmentation' }}
        run: |
          python scripts/aso_runner.py
